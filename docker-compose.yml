services:
  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/caddy/entrypoint.sh"]
    env_file:
      - path: ./deploy/domains.env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./frontend/dist:/srv/www:ro
    depends_on:
      - api

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
      - path: ./deploy/domains.env
        required: false
    volumes:
      - api_data:/app/data
    expose:
      - "8000"

volumes:
  caddy_data:
  caddy_config:
  api_data:
